[pytest]
env =
    PYTHONUTF8=1
addopts = -vs
; addopts = -v --html=reports/report.html --self-contained-html

; ----------------- raportowanie / logi ------------------
log_cli = true
log_cli_level = INFO
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S


; ----------------- znaczniki ------------------
markers =
    ; nazwa_markera: mój opis tego markera
    ; ----------------- testy jednostkowe ------------------
    dodaj: dodawanie
    dodaj_z_parametrami: dodaj_z_parametrami
    podziel: dzielenie
    powitanie: powitanie
    dodaj_z_fixture: dodaj_z_fixture
    zadanie: zadanie
    ; ----------------- testy API ------------------
    api_login: api_login
    api: api
    employees: employees
    get_employees: get_employees
    create_employee: tworzenie pracownika (POST /api/employees)
    update_employee: aktualizacja pracownika (PUT /api/employees/{id})
    delete_employee: usuwanie pracownika (DELETE /api/employees/{id})
    ; ----------------- testy ui ------------------
    ui: ui
    ui_login: ui_login



