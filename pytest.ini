[pytest]
addopts = -vs

markers =
    ; nazwa_markera: mój opis tego markera
    dodaj: dodawanie
    dodaj_z_parametrami: dodaj_z_parametrami
    podziel: dzielenie
    powitanie: powitanie
    dodaj_z_fixture: dodaj_z_fixture
    zadanie: zadanie
    api_login: api_login
    api: api
    employees: employees
    get_employees: get_employees



log_cli = true
log_cli_level = INFO
log_level = DEBUG
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

