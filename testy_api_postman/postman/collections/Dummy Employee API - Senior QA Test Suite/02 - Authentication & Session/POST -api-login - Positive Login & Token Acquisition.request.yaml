$kind: http-request
name: POST /api/login - Positive Login & Token Acquisition
description: Logowanie poprawnymi poświadczeniami oraz automatyczne ustawienie tokena w kolekcji.
url: "{{base_url}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "{{username}}",
        "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable (< 600ms)", function () {
          pm.expect(pm.response.responseTime).to.be.below(600);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Token response contract validation", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an("object");
          pm.expect(jsonData).to.have.property("access_token");
          pm.expect(jsonData.access_token).to.be.a("string").and.not.empty;
          pm.expect(jsonData).to.have.property("token_type");
          pm.expect(jsonData.token_type.toLowerCase()).to.eql("bearer");
          pm.expect(jsonData).to.have.property("expires_in");
          pm.expect(jsonData.expires_in).to.be.a("number").and.above(0);
      });

      // Ekstrakcja tokena do zmiennych kolekcji
      var jsonData = pm.response.json();
      if (jsonData.access_token) {
          pm.collectionVariables.set("access_token", jsonData.access_token);
          console.log("[AUTH] Token pomyślnie zapisany w collectionVariables:", jsonData.access_token);
      }
    language: text/javascript
order: 1000
