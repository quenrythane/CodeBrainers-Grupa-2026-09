$kind: http-request
name: POST /api/login - Negative (Invalid Password - 401)
description: Negatywna weryfikacja logowania z błędnym hasłem.
url: "{{base_url}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "{{username}}",
        "password": "niepoprawne_haslo_123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response error detail message is correct", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("detail");
          pm.expect(jsonData.detail).to.eql("Invalid username or password");
      });
    language: text/javascript
order: 2000
