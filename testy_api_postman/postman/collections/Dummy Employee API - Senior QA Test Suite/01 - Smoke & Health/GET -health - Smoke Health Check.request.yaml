$kind: http-request
name: GET /health - Smoke Health Check
description: Weryfikacja dostępności serwisu (Smoke test).
url: "{{base_url}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Status name is OK", function () {
          pm.response.to.have.status("OK");
      });

      pm.test("Response time is acceptable (< 300ms)", function () {
          pm.expect(pm.response.responseTime).to.be.below(300);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Health status payload returns ok", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an("object");
          pm.expect(jsonData).to.have.property("status");
          pm.expect(jsonData.status).to.eql("ok");
      });
    language: text/javascript
order: 1000
