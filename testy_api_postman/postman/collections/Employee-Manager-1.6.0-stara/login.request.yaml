$kind: http-request
url: "{{base_url}}/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"{{username}}\",\r

    \    \"password\": \"{{password}}\"\r

    }"
scripts:
  - type: afterResponse
    code: |+
      // tutaj zapisuejmy token w zmiennej kolekcji access_token
      var jsonData = pm.response.json();

      pm.collectionVariables.set("access_token", jsonData.access_token);



      pm.test("Czy kod status jest 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Czy kod status jest 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Body matches string", function () {
          pm.expect(pm.response.text()).to.include("bearer");
      });


    language: text/javascript
order: 2000
